name: invoice-service-codeql

on:
  push:
    branches:
      - main
    paths:
      - "invoice-service/**"
      - ".github/workflows/invoice-service-codeql.yml"

  pull_request:
    branches:
      - main
    paths:
      - "invoice-service/**"
      - ".github/workflows/invoice-service-codeql.yml"

  schedule:
    - cron: "30 2 * * 1"

permissions:
  contents: read
  security-events: write
  actions: read

concurrency:
  group: invoice-service-codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: CodeQL Java analysis
    runs-on: ubuntu-latest
    timeout-minutes: 20

    defaults:
      run:
        working-directory: invoice-service

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: java
          build-mode: manual

      - name: Make Maven wrapper executable
        run: chmod +x mvnw

      - name: Build for CodeQL
        run: ./mvnw --batch-mode -DskipTests compile

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
