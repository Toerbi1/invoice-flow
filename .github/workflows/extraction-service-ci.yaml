name: Python CI

on:
  push:
    branches:
      - main
    paths:
      - "tools/**"
      - "extraction/**"
      - ".github/workflows/python-ci.yml"

  pull_request:
    branches:
      - main
    paths:
      - "tools/**"
      - "extraction/**"
      - ".github/workflows/python-ci.yml"

jobs:
  python-checks:
    name: Python checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            tools/invoice-generator/requirements.txt
            extraction/worker/requirements.txt

      - name: Install generator dependencies
        working-directory: tools/invoice-generator
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install worker dependencies
        working-directory: extraction/worker
        run: |
          pip install -r requirements.txt

      - name: Install gateway dependencies
        working-directory: extraction/gateway
        run: |
            pip install -r requirements.txt

      - name: Check Python syntax
        run: |
          python -m compileall tools extraction

      - name: Generate invoice test PDFs
        working-directory: tools/invoice-generator
        run: |
          python main.py

      - name: Run extraction worker tests
        working-directory: extraction/worker
        run: |
          python -m pytest -q
