name: invoice-service-ci

on:
  push:
    branches:
      - main
    paths:
      - "invoice-service/**"
      - ".github/workflows/invoice-service-ci.yml"

  pull_request:
    branches:
      - main
    paths:
      - "invoice-service/**"
      - ".github/workflows/invoice-service-ci.yml"

permissions:
  contents: read

concurrency:
  group: invoice-service-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Maven verify
    runs-on: ubuntu-latest
    timeout-minutes: 20

    defaults:
      run:
        working-directory: invoice-service

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Make Maven wrapper executable
        run: chmod +x mvnw

      - name: Verify service
        run: ./mvnw --batch-mode verify
