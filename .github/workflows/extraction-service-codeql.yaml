name: python-services-codeql

on:
  push:
    branches:
      - main
    paths:
      - "extraction/gateway/**"
      - "extraction/worker/**"
      - ".github/workflows/python-services-codeql.yml"

  pull_request:
    branches:
      - main
    paths:
      - "extraction/gateway/**"
      - "extraction/worker/**"
      - ".github/workflows/python-services-codeql.yml"

  schedule:
    - cron: "45 2 * * 1"

permissions:
  contents: read
  security-events: write
  actions: read

concurrency:
  group: python-services-codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: CodeQL Python analysis
    runs-on: ubuntu-latest
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        service:
          - extraction-gateway
          - extraction-worker

    defaults:
      run:
        working-directory: ${{ matrix.service }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: python
          queries: security-extended

      - name: Install dependencies if present
        shell: bash
        run: |
          if [ -f requirements.txt ]; then
            python -m pip install --upgrade pip
            pip install -r requirements.txt
          elif [ -f pyproject.toml ]; then
            python -m pip install --upgrade pip
            pip install .
          else
            echo "No Python dependency file found for ${{ matrix.service }}"
          fi

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
